<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A atualizar o Portal…</title>
<meta name="theme-color" content="#071b50">
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#071b50;color:#fff;font:600 16px Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:420px}.ring{width:42px;height:42px;margin:0 auto 18px;border:4px solid #ffffff38;border-top-color:#d5ad45;border-radius:50%;animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}p{opacity:.82;line-height:1.5}
</style>
</head>
<body>
<div class="box"><div class="ring"></div><h1>A atualizar o Portal</h1><p>A remover a versão antiga. Será encaminhado automaticamente.</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
  }catch(error){console.warn('Não foi possível limpar todo o cache.',error)}
  setTimeout(()=>location.replace('/sistema?v=32'),700);
})();
</script>
</body>
</html>
